# Continuous integration (E10, E11): every push runs the whole test suite; pushes to
# main also build a standalone package for Windows, macOS and Linux and keep each as a
# downloadable artifact. Every build verifies itself with --selftest before it is kept.
#
# Pushing a tag like v0.1.0 does the same and then attaches the three packages to a
# draft release, with the notes taken from CHANGELOG.md. The release stays a draft
# until a human publishes it.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -q --durations=10

  package:
    name: Package (${{ matrix.name }})
    needs: tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: dist/Cosmos-*-windows-*.zip
          - os: macos-latest
            name: macos
            artifact: dist/Cosmos-*-macos-*.zip
          - os: ubuntu-latest
            name: linux
            artifact: dist/Cosmos-*-linux-*
    permissions:
      contents: write          # only used by the release step, and only on a tag
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Qt and FUSE libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core \
            libfuse2t64 desktop-file-utils

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # The AppImage is optional: without the tool the build falls back to a tarball,
      # which is just as self-contained, so a failure here must not fail the job.
      - name: appimagetool (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build, self-test and package
        # The self-test needs a display on Linux and macOS; offscreen is enough.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/build_app.py --clean --package

      - uses: actions/upload-artifact@v7
        with:
          name: Cosmos-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifact }}
          retention-days: 14
          if-no-files-found: error

      # Three jobs reach this at once, so whichever arrives first creates the draft
      # and the other two simply upload into it.
      - name: Attach the package to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          python tools/release_notes.py "$version" > release-notes.md
          for attempt in 1 2 3; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            gh release create "$TAG" --draft --title "Cosmos $version" -F release-notes.md && break
            sleep 5
          done
          gh release view "$TAG" >/dev/null   # fail loudly rather than skip the upload
          gh release upload "$TAG" ${{ matrix.artifact }} --clobber
