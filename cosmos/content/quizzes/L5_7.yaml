- question: "Thomson scattering polarises the CMB only if the radiation reaching the electron has which kind of anisotropy?"
  choices: ["A monopole", "A dipole", "A quadrupole", "Any anisotropy at all"]
  answer: 2
  explanation: "A monopole and a dipole both cancel. Only a quadrupole — hotter along one axis, colder along the perpendicular one — leaves a net polarisation."
- question: "Why do the E-mode acoustic peaks fall where the temperature peaks do not?"
  choices:
    - "Polarisation travels more slowly"
    - "Polarisation is generated by the plasma's velocity, which is a quarter-cycle out of phase with its compression"
    - "They are measured at a different frequency"
    - "Lensing shifts them"
  answer: 1
  explanation: "Temperature comes mostly from compression, polarisation from the velocity — like the position and speed of a pendulum."
- question: "Why does the polarisation signal die away at very low ℓ, where the temperature has its Sachs–Wolfe plateau?"
  choices:
    - "Foregrounds swamp it"
    - "Polarisation is only generated during the short time the universe is decoupling, so very large scales have no time to build a quadrupole"
    - "Those scales are outside the observable universe"
    - "The detectors are not sensitive there"
  answer: 1
  explanation: "The finite thickness of the last-scattering surface sets the largest angle over which an electron can see a quadrupole."
- question: "What can produce B modes at the last-scattering surface?"
  choices:
    - "Density (scalar) perturbations"
    - "Gravitational waves (tensor perturbations)"
    - "Both equally"
    - "Nothing: B modes are always instrumental"
  answer: 1
  explanation: "A scalar perturbation gives a pure-gradient velocity field, whose polarisation pattern has no curl. Tensors have a handedness and make both E and B."
- question: "What does the E-mode bump at ℓ < 10 measure?"
  choices:
    - "The tensor-to-scalar ratio r"
    - "The optical depth τ from reionisation"
    - "The baryon density"
    - "The curvature of space"
  answer: 1
  explanation: "Photons rescattering off the electrons freed by the first stars are polarised on the angular scale of the horizon at reionisation; the bump's height gives τ."
- question: "Why does τ matter so much beyond reionisation itself?"
  choices:
    - "It changes the age of the universe"
    - "The acoustic peaks are damped by e^(−2τ), so without an independent τ the fluctuation amplitude A_s cannot be separated from it"
    - "It sets the CMB temperature"
    - "It determines the number of neutrino species"
  answer: 1
  explanation: "Only the combination A_s e^(−2τ) is well measured from temperature alone, and A_s feeds straight into σ8."
- question: "How does gravitational lensing create B modes?"
  choices:
    - "It creates new polarisation"
    - "It shears the E-mode pattern, and a sheared gradient is no longer a pure gradient"
    - "It rotates the polarisation angle at random"
    - "It converts temperature into polarisation"
  answer: 1
  explanation: "Lensing moves the polarisation around rather than making it, but the shearing mixes a little E power into B, peaking near ℓ ≈ 1000."
- question: "BICEP2's 2014 claim of r ≈ 0.2 did not survive. What was the signal?"
  choices:
    - "An instrumental artefact"
    - "Mostly polarised emission from dust in our own Galaxy"
    - "Lensing B modes"
    - "A statistical fluctuation"
  answer: 1
  explanation: "Magnetically aligned dust grains in the Milky Way emit polarised microwaves with B modes of their own; separating them needs several observing frequencies."
- question: "What is 'delensing'?"
  choices:
    - "Observing a patch of sky with no foreground matter"
    - "Predicting the lensing B modes from a measured matter distribution and subtracting them"
    - "Using a wider telescope"
    - "Removing gravitational lensing from the galaxy survey"
  answer: 1
  explanation: "Lensing B modes are a real CMB signal, so they cannot be avoided by looking elsewhere — but they can be modelled and removed, with 90% as the working target."
