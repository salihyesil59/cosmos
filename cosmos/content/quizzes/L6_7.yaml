- question: "Which observation is hardest for MOND to explain without extra unseen matter?"
  choices:
    - "Flat rotation curves of spiral galaxies"
    - "The baryonic Tully–Fisher relation"
    - "The Bullet Cluster and the height of the third CMB peak"
    - "The orbits of planets"
