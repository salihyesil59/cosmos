- question: "According to MOND, what happens at accelerations far below a₀ ≈ 1.2 × 10⁻¹⁰ m/s²?"
  choices:
    - "Gravity switches off"
    - "Gravity becomes stronger than Newton's law, g ≈ √(g_N a₀)"
    - "Gravity becomes repulsive"
    - "Nothing changes"
