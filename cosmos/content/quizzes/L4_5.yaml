- question: "Why did neutrinos decouple from the cosmic plasma about one second after the Big Bang?"
  choices:
    - "They all decayed into photons"
    - "Their weak interaction rate fell below the expansion rate of the universe"
    - "They became electrically charged"
    - "Gravity became too strong"
  answer: 1
  explanation: "The weak rate falls as T⁵ while H falls as T², so their ratio drops below one at about 1 MeV."
- question: "Why is the cosmic neutrino background colder than the CMB?"
  choices:
    - "Neutrinos lose energy by colliding with dust"
    - "Electron–positron annihilation heated the photons after the neutrinos had already decoupled"
    - "Neutrinos are heavier than photons"
    - "Neutrinos were released later than photons"
  answer: 1
  explanation: "The annihilation energy went only into the photons, giving T_ν/T_γ = (4/11)^(1/3) ≈ 0.714."
- question: "What is the temperature of the cosmic neutrino background today?"
  choices: ["2.73 K", "1.95 K", "0.51 K", "3 000 K"]
  answer: 1
  explanation: "0.714 × 2.7255 K ≈ 1.95 K."
- question: "How many relic neutrinos (all flavours, including antineutrinos) are in each cubic centimetre of space?"
  choices: ["About 1", "About 56", "About 336", "About 10⁹"]
  answer: 2
  explanation: "About 112 per flavour, 336 in total, compared with 411 CMB photons."
- question: "How has cosmology detected the effect of the relic neutrinos?"
  choices:
    - "By capturing them in underground detectors"
    - "Through N_eff, measured from the helium abundance and the CMB, which comes out close to 3"
    - "By seeing them glow in infrared telescopes"
    - "It has not found any evidence at all"
  answer: 1
  explanation: "The neutrinos' energy density changes the expansion rate during BBN and leaves imprints in the CMB; both give N_eff ≈ 3."
