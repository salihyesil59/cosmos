- question: "Which of these is NOT something we know about dark matter?"
  choices:
    - "It is not made of ordinary baryons"
    - "It was cold when structure began to form"
    - "The mass of one dark matter particle"
    - "It is stable over the age of the universe"
  answer: 2
  explanation: "The allowed masses span some ninety orders of magnitude, from 10⁻²² eV to tens of solar masses."
- question: "What is the 'WIMP miracle'?"
  choices:
    - "WIMPs were detected in 2012"
    - "A particle with weak-scale annihilation rate would freeze out with about the observed dark matter density"
    - "WIMPs explain dark energy too"
    - "WIMPs are made in stars"
  answer: 1
  explanation: "Ωh² ≈ 0.12 × (2.2 × 10⁻²⁶ cm³/s / ⟨σv⟩), and a ~100 GeV weakly interacting particle has about that ⟨σv⟩."
- question: "Why do light WIMPs need detectors made of light nuclei?"
  choices:
    - "Light nuclei are cheaper"
    - "A light WIMP barely moves a heavy nucleus, so the recoil falls below the energy threshold"
    - "Heavy nuclei absorb WIMPs"
    - "Light nuclei have more neutrons"
  answer: 1
  explanation: "E_R,max = 2μ²v²/m_A: a 5 GeV WIMP gives xenon about 0.2 keV but silicon almost four times more."
- question: "A detector sees only its expected background. What can it conclude?"
  choices:
    - "Nothing at all"
    - "That dark matter does not exist"
    - "That any WIMP which would have produced more than a few events is excluded — an exclusion curve"
    - "That WIMPs are heavier than 1 TeV"
  answer: 2
  explanation: "With no excess, cross-sections giving more than about 2.3 events are ruled out at 90% confidence, mass by mass."
- question: "What is the neutrino fog?"
  choices:
    - "A cloud of neutrinos around the Sun"
    - "The background from solar and atmospheric neutrinos scattering off nuclei, which mimics WIMPs"
    - "A kind of dark matter"
    - "Noise in the detector electronics"
  answer: 1
  explanation: "Coherent neutrino–nucleus scattering produces recoils just like WIMPs; XENONnT and PandaX-4T saw the first hints of it from solar ⁸B neutrinos in 2024."
- question: "How does a haloscope such as ADMX look for axions?"
  choices:
    - "By counting nuclear recoils"
    - "By tuning a microwave cavity in a strong magnetic field, where axions would convert to photons of frequency m_a c²/h"
    - "By watching for gamma rays from dwarf galaxies"
    - "By colliding protons"
  answer: 1
  explanation: "A 1 μeV axion becomes a 242 MHz photon; the cavity is scanned across frequencies like a radio looking for a station."
